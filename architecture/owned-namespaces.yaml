schema_version: 1
authorities:
  collector: streaming-source-collector
  workload_execution: model-workload-runtime
  incident_lifecycle: incident-event-engine
  client_mutation_boundary: rest-api-integration-gateway
namespaces:
  - owner: streaming-source-collector
    path: runtime/collector
  - owner: analysis-enrichment-engine
    path: runtime/analyzer
  - owner: model-workload-runtime
    path: runtime/runtime
  - owner: incident-event-engine
    path: runtime/incidents
  - owner: rest-api-integration-gateway
    path: runtime/api
  - owner: client-applications
    path: runtime/client
resources:
  databases:
    collector: runtime/collector/collector.db
    analyzer: runtime/analyzer/analyzer.db
    runtime: runtime/runtime/runtime.db
    incidents: runtime/incidents/incidents.db
    api: runtime/api/api.db
  artifacts:
    collector: runtime/collector/artifacts
    analyzer: runtime/analyzer/artifacts
    runtime: runtime/runtime/artifacts
    incidents: runtime/incidents/artifacts
    api: runtime/api/artifacts
  secrets:
    collector: runtime/collector/secrets
    analyzer: runtime/analyzer/secrets
    runtime: runtime/runtime/secrets
    incidents: runtime/incidents/secrets
    api: runtime/api/secrets
