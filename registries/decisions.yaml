  - name: Do not adopt observation interoperability maps to ogc sensorthings
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Keep a compact internal schema while providing a documented mapping to SensorThings concepts
    and GeoJSON/STAC/CAP where appropriate.
  consequences:
  - The MVP need not implement a complete SensorThings server, but export/import mapping and conformance fixtures
    are tested.
  requirement_ids: []
  evidence_ids:
  - EV-TECHNICAL-CONTRACT
  complexity_impact: Implemented through bounded tasks and the six-component module policy.
  test_strategy: Exercise the decision through criterion-linked unit, integration, security, recovery, or E2E tests.
  reversal_plan: Supersede with a new accepted ADR and rerun every affected requirement and release gate.
- id: ADR-0023
  title: Signed reproducibility and supply-chain manifests
  status: ACCEPTED
  context: Optimization and safety claims are meaningless without exact artifact identity.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: Generate release, model, configuration, fixture, benchmark and SBOM manifests, hash all artifacts, and
      sign release-grade manifests under a declared verification policy before startup/benchmark replay.
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt signed reproducibility and supply-chain manifests
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Generate release, model, configuration, fixture, benchmark and SBOM manifests, hash all artifacts,
    and sign release-grade manifests under a declared verification policy before startup/benchmark replay.
  consequences:
  - Dirty/unverified runs are rejected or explicitly labelled.
  requirement_ids: []
  evidence_ids:
