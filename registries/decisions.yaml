- id: ADR-0007
  title: Hybrid criticality plus EDF
  status: ACCEPTED
  context: Pure priority can starve periodic jobs; pure EDF can let low-criticality work interfere with seismic
    processing.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: Use fixed criticality tiers and earliest-deadline-first within a tier.
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt hybrid criticality plus edf
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Use fixed criticality tiers and earliest-deadline-first within a tier.
  consequences:
  - Each workload declares deadline, empirical service budget, minimum cadence and maximum deferral.
  requirement_ids: []
  evidence_ids:
  - EV-TECHNICAL-CONTRACT
  complexity_impact: Implemented through bounded tasks and the six-component module policy.
