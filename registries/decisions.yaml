- id: ADR-0010
  title: Module-owned SQLite WAL stores plus atomic files
  status: ACCEPTED
  context: Offline, inspectable and sufficient for one node without turning one shared database into a hidden integration
    API.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: Use SQLite WAL for each backend module's owned metadata store and atomic/content-addressed files for owned
      evidence/artifacts.
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt module-owned sqlite wal stores plus atomic files
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Use SQLite WAL for each backend module's owned metadata store and atomic/content-addressed files
    for owned evidence/artifacts.
  consequences:
  - No cloud database is required; cross-module state access uses public ports/contracts rather than direct tables.
  requirement_ids: []
