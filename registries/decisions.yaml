- id: ADR-0021
  title: Runtime/provider bake-off
  status: ACCEPTED
  context: ONNX Runtime 1.25 removed ArmNN, while CPU EP, KleidiAI, XNNPACK and ACL behavior remains graph-, build-
    and instruction-specific.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: Benchmark the released ONNX Runtime CPU EP first, then a reproducible CPU EP/MLAS build with KleidiAI
      enabled, XNNPACK for compatible floating-point graphs, and only a time-boxed ACL diagnostic. ArmNN is excluded.
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt runtime/provider bake-off
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Benchmark the released ONNX Runtime CPU EP first, then a reproducible CPU EP/MLAS build with
    KleidiAI enabled, XNNPACK for compatible floating-point graphs, and only a time-boxed ACL diagnostic. ArmNN
    is excluded.
  consequences:
  - The release records the ORT tag/commit, compiler, build flags, CPU feature record, providers, per-node assignment/fallback,
    thread policy and measured result. Raspberry Pi 5 receives no SVE, SME or SME2 claim.
  requirement_ids: []
  evidence_ids:
  - EV-TECHNICAL-CONTRACT
  complexity_impact: Implemented through bounded tasks and the six-component module policy.
  test_strategy: Exercise the decision through criterion-linked unit, integration, security, recovery, or E2E tests.
  reversal_plan: Supersede with a new accepted ADR and rerun every affected requirement and release gate.
