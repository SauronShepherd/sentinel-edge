- id: ADR-0184
  title: Drift surveillance manages profile validity and can only weaken trust
  status: ACCEPTED
  context: “Monitor input distribution and entropy” is not an operational contract. Brightness changes, sensor bias,
    a new source algorithm, missingness, seasonal prevalence and genuine concept drift have different remedies.
    Rare-event labels arrive late and operator actions are not automatically ground truth.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
