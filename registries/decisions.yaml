- id: ADR-0180
  title: I/O pressure and persistence tails are service inputs
  status: ACCEPTED
  context: A Raspberry Pi can have available CPU and RAM while all useful work stalls on SD/SSD I/O or forced writeback.
    Evidence clips, logs, telemetry, backup, garbage collection and SQLite checkpoints can coincide with a seismic
    trigger and create tail latency not explained by CPU or memory metrics. Linux PSI exposes I/O stalls and supports
    pressure-triggered load shedding.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: Treat storage I/O contention, dirty-page writeback, synchronous durability, WAL checkpointing, evidence
      encoding and maintenance work as explicit resource dimensions for admission, degradation and benchmark validity.
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt i/o pressure and persistence tails are service inputs
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Treat storage I/O contention, dirty-page writeback, synchronous durability, WAL checkpointing,
    evidence encoding and maintenance work as explicit resource dimensions for admission, degradation and benchmark
    validity.
  consequences:
  - Implementation and verification must preserve the i/o pressure and persistence tails are service inputs contract.
  requirement_ids: []
  evidence_ids:
  - EV-TECHNICAL-CONTRACT
  complexity_impact: Implemented through bounded tasks and the six-component module policy.
