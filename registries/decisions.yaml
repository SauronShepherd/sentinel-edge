  status: ACCEPTED
  context: v0.15 said webhook transport is “authenticated” but did not define the proof. HTTPS authenticates the
    server to the sender, and IP allowlists are brittle supplementary controls; neither proves that an inbound payload
    was generated by the intended provider. Retries/replays are normal webhook behavior and must survive restart.
