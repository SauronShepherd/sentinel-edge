  reversal_plan: Supersede with a new accepted ADR and rerun every affected requirement and release gate.
- id: ADR-0181
  title: Application artifact trust and host/boot trust are separate claims
  status: ACCEPTED
  context: A compromised kernel or privileged host can lie about hashes, process isolation, clocks and benchmark
    samples. Application signatures authenticate files to a verifier; they do not prove the verifier or boot chain
    is trustworthy. Raspberry Pi documents customer-key secure boot, but that is a deployment-specific signed image
    and key-lifecycle decision rather than a default Raspberry Pi OS property.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: Publish a host trust profile independently from release/model/config signature verification. H0 may run
      on an explicitly unmeasured general-purpose host; field profiles may qualify a stricter signed-boot/read-only-root
      design.
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt application artifact trust and host/boot trust are separate claims
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Publish a host trust profile independently from release/model/config signature verification.
    H0 may run on an explicitly unmeasured general-purpose host; field profiles may qualify a stricter signed-boot/read-only-root
    design.
  consequences:
  - Implementation and verification must preserve the application artifact trust and host/boot trust are separate
    claims contract.
