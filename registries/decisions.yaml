- id: ADR-0017
  title: Empirical service budgets, not claimed WCET
  status: ACCEPTED
  context: Python, Linux and general-purpose inference runtimes do not provide a formally proven worst-case bound.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: Replace nominal WCET-style estimates with profile-specific service-time budgets measured at p99/p99.9
      plus margin.
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt empirical service budgets, not claimed wcet
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Replace nominal WCET-style estimates with profile-specific service-time budgets measured at p99/p99.9
    plus margin.
  consequences:
  - Budgets are invalidated when hardware, cooling, runtime, model, input shape, thread policy or process placement
    changes.
  requirement_ids: []
  evidence_ids:
  - EV-TECHNICAL-CONTRACT
  complexity_impact: Implemented through bounded tasks and the six-component module policy.
  test_strategy: Exercise the decision through criterion-linked unit, integration, security, recovery, or E2E tests.
  reversal_plan: Supersede with a new accepted ADR and rerun every affected requirement and release gate.
- id: ADR-0018
  title: Admission and isolation instead of hard-preemption claims
  status: ACCEPTED
  context: An application cannot safely interrupt most native inference kernels mid-call.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: Use worker isolation, global thread budgets, CPU affinity/cgroups, nonpreemptible admission gates and
      cooperative cancellation contracts.
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt admission and isolation instead of hard-preemption claims
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Use worker isolation, global thread budgets, CPU affinity/cgroups, nonpreemptible admission gates
    and cooperative cancellation contracts.
  consequences:
  - Tier A work is protected by not starting risky lower-tier work, not by promising arbitrary kernel interruption.
  requirement_ids: []
  evidence_ids:
  - EV-TECHNICAL-CONTRACT
  complexity_impact: Implemented through bounded tasks and the six-component module policy.
  test_strategy: Exercise the decision through criterion-linked unit, integration, security, recovery, or E2E tests.
  reversal_plan: Supersede with a new accepted ADR and rerun every affected requirement and release gate.
