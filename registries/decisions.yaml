- id: ADR-0154
  title: Observations use typed measurement records, not parallel value/unit maps
  status: ACCEPTED
  context: Parallel `values` and `units` maps permit key mismatch and cannot safely distinguish rainfall rate from
    accumulation, stage height from depth, absolute level from datum-relative level, or one IMU/tilt axis convention
    from another. One observation-level quality value also hides a failed channel inside an otherwise valid record.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: '`ObservationV2` supersedes v0.16’s parallel `values`/`units` observation wire shape. Section 11.1 now
      contains the authoritative current contract. Every measurement pairs its value with observed-property identity,
      unit, statistic/interval, per-value quality, axis/reference and uncertainty. High-rate arrays remain bounded
      artifact references.'
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt observations use typed measurement records, not parallel value/unit maps
