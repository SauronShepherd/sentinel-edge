    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Classify release artifacts by reproducibility evidence, record build-environment and network
    closure, and bind provenance/SBOM/signature/runtime review/VEX to the same subject digest.
