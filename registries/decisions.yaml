- id: ADR-0183
  title: Provenance, reproducibility, hermeticity and VEX are different evidence
  status: ACCEPTED
  context: A signed SLSA provenance statement can faithfully say that a particular builder produced an artifact
    without proving another builder can reproduce it. Lockfiles do not prevent undeclared network inputs or timestamp/path
    nondeterminism. A VEX “not affected” statement is a time-bounded analysis, not a permanent override for an incomplete
    dependency graph.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
