- id: ADR-0182
  title: UTC trust includes source authenticity and permitted use
  status: ACCEPTED
  context: Source freshness, certificate/update expiry, webhook replay windows and peer correlation depend on UTC.
    An attacker or faulty network time source can produce plausible low-uncertainty timestamps. Offline operation
    also needs to distinguish RTC/manual/fixture time from authenticated network time.
  drivers:
  - Full-scope Sentinel Edge technical contract
  - Deterministic verification and explicit authority
  alternatives:
  - name: Extend clock quality with a source-trust record and a use matrix. Local scheduling stays monotonic. Connected
      field profiles may qualify RFC 8915 NTS; unauthenticated NTP never becomes high-assurance UTC merely because
      offset/dispersion appears small.
    pros:
    - Matches the accepted technical contract
    cons:
    - Requires implementation and qualification evidence
  - name: Do not adopt utc trust includes source authenticity and permitted use
    pros:
    - Reduces immediate implementation work
    cons:
    - Breaks the accepted contract or weakens its evidence boundary
  selected_option: Extend clock quality with a source-trust record and a use matrix. Local scheduling stays monotonic.
    Connected field profiles may qualify RFC 8915 NTS; unauthenticated NTP never becomes high-assurance UTC merely
    because offset/dispersion appears small.
  consequences:
  - Implementation and verification must preserve the utc trust includes source authenticity and permitted use contract.
