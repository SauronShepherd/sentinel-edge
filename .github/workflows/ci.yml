name: sentinel-edge-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python scripts/check_contract_sync.py
      - run: python -m pytest
      - run: python -m sentinel_edge.cli doctor
      - run: python -m sentinel_edge.cli run-scenario fixtures/scenarios/simultaneous-event.json --state-dir /tmp/sentinel-scenario
      - run: python -m sentinel_edge.cli benchmark-replay fixtures/scenarios/benchmark-open-loop.json
      - run: python -m sentinel_edge.cli after-event-review fixtures/scenarios/simultaneous-event.json --state-dir /tmp/sentinel-aer --output /tmp/aer.json
      - run: python -m sentinel_edge.cli activate-configuration fixtures/configuration/default-v0.4.0.yaml --state-dir /tmp/sentinel-config
      - run: python -m sentinel_edge.cli build-release-candidate --root . --state-dir /tmp/sentinel-release --output /tmp/release-candidate.json
      - run: python -m sentinel_edge.cli verify-release-candidate /tmp/release-candidate.json --root .
