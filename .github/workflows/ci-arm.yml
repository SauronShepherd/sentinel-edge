
name: CI Arm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-planned:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project test dependencies
        run: python -m pip install -e '.[test]'
      - run: python scripts/dev.py setup
      - name: Planned Arm lane guard
        run: python scripts/dev.py test-arm
      - name: State declaration
        run: echo 'Arm benchmark capability is planned; this job is not benchmark evidence.'
