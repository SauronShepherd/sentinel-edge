
name: CI Fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project test dependencies
        run: python -m pip install -e '.[test]'
      - run: python scripts/dev.py setup
      - run: python scripts/dev.py format
      - run: python scripts/dev.py lint
      - run: python scripts/dev.py type
      - run: python scripts/dev.py architecture
      - run: python scripts/dev.py governance
